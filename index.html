<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e2952" />

    <!-- Primary SEO -->
    <title>PointVault — Find Survey Monuments Fast | Land Survey Point Database</title>
    <meta
      name="description"
      content="Field-ready app for land surveyors. Import your job points, find existing survey monuments by GPS, and share monument data with other survey companies. Works on phone, tablet, or desktop. Offline-capable PWA."
    />
    <meta
      name="keywords"
      content="land surveying, survey monuments, property corners, survey point database, monument recovery, land surveyor app, survey app, property corner finder, NW Florida survey, surveying tool, PointVault"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://pointvault.vercel.app/" />
    <meta name="author" content="PointVault" />

    <!-- Favicons + Apple -->
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PointVault" />

    <!-- Open Graph (Facebook / LinkedIn / iMessage / Slack previews) -->
    <meta property="og:site_name" content="PointVault" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pointvault.vercel.app/" />
    <meta property="og:title" content="PointVault — Find Survey Monuments Fast" />
    <meta
      property="og:description"
      content="Field-ready app for land surveyors. Import job points, find existing monuments by GPS, and share monument data with other survey companies."
    />
    <meta property="og:image" content="https://pointvault.vercel.app/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PointVault — Find Survey Monuments Fast" />
    <meta
      name="twitter:description"
      content="Field-ready app for land surveyors. Import job points, find existing monuments by GPS, and share monument data with other companies."
    />
    <meta name="twitter:image" content="https://pointvault.vercel.app/icon-512.png" />

    <!-- Structured data: SoftwareApplication. Helps Google show rich result cards. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "PointVault",
        "description": "Field-ready PWA for land surveyors. Import job points, find existing survey monuments by GPS, and share monument data with other survey companies.",
        "url": "https://pointvault.vercel.app/",
        "image": "https://pointvault.vercel.app/icon-512.png",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Land Surveying",
        "operatingSystem": "Web, iOS, Android",
        "offers": {
          "@type": "Offer",
          "price": "10.00",
          "priceCurrency": "USD",
          "description": "$10/month per seat, 1-seat free tier"
        },
        "featureList": [
          "Import survey job points (CSV/TXT) with column mapping",
          "Find existing monuments by GPS proximity",
          "Share monument data with other survey companies",
          "Add field observations and community notes",
          "Works offline as a Progressive Web App"
        ]
      }
    </script>

    <!-- Organization data so Google can build a company knowledge panel. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PointVault",
        "url": "https://pointvault.vercel.app/",
        "logo": "https://pointvault.vercel.app/icon-512.png",
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "support@pointvault.app",
          "contactType": "Customer Support",
          "availableLanguage": "English"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:640px;margin:48px auto;padding:24px;font-family:system-ui,sans-serif;color:#0f172a;line-height:1.6">
        <h1 style="margin:0 0 12px">PointVault</h1>
        <p>PointVault is a field-ready app for land surveyors — import your job points, find existing survey monuments by GPS, and share monument data with other survey companies.</p>
        <p>This app needs JavaScript to run. Please enable JavaScript and reload, or visit <a href="/privacy.html">our privacy policy</a> for more information.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
